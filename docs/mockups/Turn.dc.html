<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goose Jumps – Turn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;800;900&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif}
a{color:#FFB347}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1F4F; color: #FFF6E5; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; padding: 20px 22px 24px; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Lilita One', sans-serif; font-size: 22px; color: #FF8A1F; -webkit-text-stroke: 2px #120C26; paint-order: stroke fill">GOOSE JUMPS</span>
    <div style="display: flex; gap: 8px">
      <a href="Ranking.dc.html" aria-label="Leaderboard" style="width: 44px; height: 44px; border-radius: 14px; background: #FFD23F; border: 3px solid #120C26; box-shadow: 0 4px 0 #120C26; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#120C26" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 20v-6h4v6M10 20V8h4v12M15 20v-9h4v9"></path></svg>
      </a>
      <button type="button" aria-label="Rules" style="width: 44px; height: 44px; border-radius: 14px; background: #FFF6E5; border: 3px solid #120C26; box-shadow: 0 4px 0 #120C26; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #120C26; cursor: pointer">?</button>
    </div>
  </div>

  <div style="background: #3A2C72; border: 4px solid #120C26; border-radius: 22px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #C9BDF2">
      <span>START</span><span>RACE TO THE FINISH</span><span>FINISH</span>
    </div>
    <div style="position: relative; height: 104px">
      <div style="position: absolute; left: 0; right: 0; top: 84px; height: 14px; border-radius: 999px; background: #2A1F4F; border: 3px solid #120C26"></div>
      <div style="position: absolute; right: -2px; top: 76px; width: 26px; height: 26px; border-radius: 8px; background: #FF8A1F; border: 3px solid #120C26"></div>
      <sc-for list="{{ racers }}" as="p" hint-placeholder-count="4">
        <div style="{{ p.pos }}">
          <div style="{{ p.ring }}">
            <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true">
              <rect x="28" y="24" width="44" height="68" rx="22" fill="{{ p.color }}" stroke="#120C26" stroke-width="6"></rect>
              <circle cx="41" cy="44" r="8" fill="#FFFFFF" stroke="#120C26" stroke-width="4"></circle>
              <circle cx="59" cy="44" r="8" fill="#FFFFFF" stroke="#120C26" stroke-width="4"></circle>
              <circle cx="43" cy="45" r="4" fill="#120C26"></circle>
              <circle cx="57" cy="45" r="4" fill="#120C26"></circle>
              <path d="M36 57 Q50 50 64 57 Q50 68 36 57 Z" fill="#FF8A1F" stroke="#120C26" stroke-width="4"></path>
            </svg>
          </div>
          <span style="font-size: 11px; font-weight: 900; background: #120C26; color: #FFF6E5; padding: 1px 6px; border-radius: 999px">{{ p.space }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background: #FF8A1F; border: 4px solid #120C26; border-radius: 26px; box-shadow: 0 7px 0 #120C26; padding: 16px; display: flex; align-items: center; gap: 14px; color: #120C26">
    <div style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%; background: #2A1F4F; border: 4px solid #120C26; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
        <rect x="28" y="24" width="44" height="68" rx="22" fill="#FFFFFF" stroke="#120C26" stroke-width="4"></rect>
        <circle cx="41" cy="44" r="9" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
        <circle cx="59" cy="44" r="9" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
        <circle cx="44" cy="42" r="4" fill="#120C26"></circle>
        <circle cx="62" cy="42" r="4" fill="#120C26"></circle>
        <path d="M36 57 Q50 50 64 57 Q50 68 36 57 Z" fill="#FF8A1F" stroke="#120C26" stroke-width="3" stroke-linejoin="round"></path>
        <rect x="35" y="5" width="30" height="18" rx="3" fill="#120C26"></rect>
        <rect x="35" y="16" width="30" height="4" fill="#FF8A1F"></rect>
        <rect x="25" y="21" width="50" height="5" rx="2.5" fill="#120C26"></rect>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 900; letter-spacing: 1.5px">ROUND 3 · SPACE 14</span>
      <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 32px; line-height: 1">It's Ziad's turn!</h1>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #C9BDF2">WHAT COLOUR IS YOUR SPACE?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Card.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #4C8DFF; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">Web</a>
      <a href="Card.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #2FD3B0; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">Cyber</a>
      <a href="Card.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #FF7EC2; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">Design</a>
      <a href="Card.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #FFD23F; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">Marketing</a>
      <a href="Event.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #B89CFF; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">? Chance</a>
      <a href="Event.dc.html" style="text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #FFF6E5; color: #120C26; font-weight: 900; font-size: 17px; border: 3px solid #120C26; box-shadow: 0 5px 0 #120C26">! Special</a>
      <a href="Battle.dc.html" style="grid-column: span 2; text-decoration: none; text-align: center; padding: 14px 8px; border-radius: 18px; background: #120C26; color: #FF8A1F; font-family: 'Lilita One', sans-serif; font-size: 20px; letter-spacing: 1px; border: 3px solid #FF8A1F; box-shadow: 0 5px 0 #120C26">VS · Battle</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Board spaces: 0 = START, 52 = FINISH
    const players = [
      { name: 'Guillaume', color: '#9FD6FF', space: 22 },
      { name: 'Ziad', color: '#FFFFFF', space: 14, active: true },
      { name: 'Mikael', color: '#FFD23F', space: 18 },
      { name: 'Chiara', color: '#FF7EC2', space: 9 }
    ];
    const width = 300;
    const racers = players.map((p, i) => ({
      color: p.color,
      space: String(p.space),
      pos: 'position: absolute; left: ' + Math.round((p.space / 52) * (width - 40)) + 'px; top: ' + (i % 2 === 0 ? 0 : 18) + 'px; display: flex; flex-direction: column; align-items: center; gap: 2px',
      ring: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #2A1F4F; display: flex; align-items: center; justify-content: center; border: 3px solid ' + (p.active ? '#FF8A1F' : '#120C26')
    }));
    return { racers };
  }
}
</script>
</body>
</html>

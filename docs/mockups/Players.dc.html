<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goose Jumps – Players</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;800;900&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif}
a{color:#FFB347}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1F4F; color: #FFF6E5; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; padding: 24px 22px 30px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFF6E5; border: 3px solid #120C26; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #120C26">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#120C26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 32px; color: #FFF6E5">Who's playing?</h1>
  </div>
  <p style="margin: 0; font-size: 14px; color: #C9BDF2; font-weight: 700">2 to 5 players · tap a goose to customise it</p>

  <div style="background: #3A2C72; border: 4px solid #120C26; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 6px 0 #120C26">
    <div style="width: 132px; height: 132px; border-radius: 50%; background: #2A1F4F; border: 4px solid #120C26; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 100 100" width="112" height="112" aria-hidden="true">
        <rect x="28" y="24" width="44" height="68" rx="22" fill="{{color}}" stroke="#120C26" stroke-width="4"></rect>
        <circle cx="41" cy="44" r="9" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
        <circle cx="59" cy="44" r="9" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
        <circle cx="43" cy="45" r="4" fill="#120C26"></circle>
        <circle cx="57" cy="45" r="4" fill="#120C26"></circle>
        <path d="M36 57 Q50 50 64 57 Q50 68 36 57 Z" fill="#FF8A1F" stroke="#120C26" stroke-width="3" stroke-linejoin="round"></path>
        <sc-if value="{{ isTop }}" hint-placeholder-val="{{ true }}">
          <rect x="35" y="5" width="30" height="18" rx="3" fill="#120C26"></rect>
          <rect x="35" y="16" width="30" height="4" fill="#FF8A1F"></rect>
          <rect x="25" y="21" width="50" height="5" rx="2.5" fill="#120C26"></rect>
        </sc-if>
        <sc-if value="{{ isCap }}" hint-placeholder-val="{{ false }}">
          <path d="M30 28 Q50 4 70 28 Z" fill="#4C8DFF" stroke="#120C26" stroke-width="3" stroke-linejoin="round"></path>
          <rect x="62" y="23" width="24" height="7" rx="3.5" fill="#4C8DFF" stroke="#120C26" stroke-width="3"></rect>
        </sc-if>
        <sc-if value="{{ isCrown }}" hint-placeholder-val="{{ false }}">
          <path d="M33 28 L35 10 L43 20 L50 6 L57 20 L65 10 L67 28 Z" fill="#FFD23F" stroke="#120C26" stroke-width="3" stroke-linejoin="round"></path>
        </sc-if>
        <sc-if value="{{ isBeanie }}" hint-placeholder-val="{{ false }}">
          <path d="M30 30 Q30 8 50 8 Q70 8 70 30 Z" fill="#FF7EC2" stroke="#120C26" stroke-width="3" stroke-linejoin="round"></path>
          <circle cx="50" cy="7" r="5" fill="#FFF6E5" stroke="#120C26" stroke-width="3"></circle>
        </sc-if>
      </svg>
    </div>
    <label for="pname" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Player name</label>
    <input id="pname" type="text" value="Ziad" style="width: 100%; box-sizing: border-box; text-align: center; font-family: 'Lilita One', sans-serif; font-size: 24px; padding: 10px; border-radius: 14px; border: 3px solid #120C26; background: #FFF6E5; color: #120C26">
    <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #C9BDF2">FEATHERS</span>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{ colors }}" as="c" hint-placeholder-count="6">
          <button type="button" aria-label="{{ c.label }}" onClick="{{ c.pick }}" style="{{ c.style }}"></button>
        </sc-for>
      </div>
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #C9BDF2; margin-top: 4px">HAT</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{ hats }}" as="h" hint-placeholder-count="4">
          <button type="button" onClick="{{ h.pick }}" style="{{ h.style }}">{{ h.label }}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{ players }}" as="p" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="{{ p.ring }}">
          <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true">
            <rect x="28" y="24" width="44" height="68" rx="22" fill="{{ p.color }}" stroke="#120C26" stroke-width="5"></rect>
            <circle cx="41" cy="44" r="8" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
            <circle cx="59" cy="44" r="8" fill="#FFFFFF" stroke="#120C26" stroke-width="3"></circle>
            <circle cx="43" cy="45" r="4" fill="#120C26"></circle>
            <circle cx="57" cy="45" r="4" fill="#120C26"></circle>
            <path d="M36 57 Q50 50 64 57 Q50 68 36 57 Z" fill="#FF8A1F" stroke="#120C26" stroke-width="3"></path>
          </svg>
        </div>
        <span style="font-size: 12px; font-weight: 800; color: #FFF6E5">{{ p.name }}</span>
      </div>
    </sc-for>
  </div>
  <button type="button" style="padding: 12px; border-radius: 18px; background: transparent; color: #C9BDF2; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; border: 3px dashed #6A5BB0; cursor: pointer">+ Add a player</button>

  <div style="flex-grow: 1"></div>
  <a href="Order.dc.html" style="display: block; text-align: center; text-decoration: none; padding: 16px; border-radius: 22px; background: #FF8A1F; color: #120C26; font-family: 'Lilita One', sans-serif; font-size: 24px; border: 4px solid #120C26; box-shadow: 0 7px 0 #120C26">ROLL FOR ORDER</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { color: '#FFFFFF', hat: 'top' };
  }
  renderVals() {
    const palette = [
      ['#FFFFFF', 'White'], ['#9FD6FF', 'Sky'], ['#FFD23F', 'Sun'],
      ['#FF7EC2', 'Bubblegum'], ['#2FD3B0', 'Mint'], ['#B89CFF', 'Lilac']
    ];
    const colors = palette.map(([hex, label]) => ({
      label: label + ' feathers',
      pick: () => this.setState({ color: hex }),
      style: 'width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: ' + hex + '; border: 3px solid #120C26; box-shadow: ' + (this.state.color === hex ? '0 0 0 3px #FF8A1F' : 'none')
    }));
    const hatList = [['top', 'Top hat'], ['cap', 'Cap'], ['crown', 'Crown'], ['beanie', 'Beanie']];
    const hats = hatList.map(([id, label]) => {
      const on = this.state.hat === id;
      return {
        label,
        pick: () => this.setState({ hat: id }),
        style: 'min-height: 44px; padding: 8px 14px; border-radius: 14px; cursor: pointer; font-family: Nunito, sans-serif; font-weight: 900; font-size: 14px; border: 3px solid #120C26; background: ' + (on ? '#FF8A1F' : '#FFF6E5') + '; color: #120C26'
      };
    });
    const ring = (active) => 'width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3A2C72; border: 3px solid ' + (active ? '#FF8A1F' : '#120C26');
    const players = [
      { name: 'Guillaume', color: '#9FD6FF', ring: ring(false) },
      { name: 'Ziad', color: this.state.color, ring: ring(true) },
      { name: 'Mikael', color: '#FFD23F', ring: ring(false) },
      { name: 'Chiara', color: '#FF7EC2', ring: ring(false) }
    ];
    return {
      color: this.state.color,
      isTop: this.state.hat === 'top', isCap: this.state.hat === 'cap',
      isCrown: this.state.hat === 'crown', isBeanie: this.state.hat === 'beanie',
      colors, hats, players
    };
  }
}
</script>
</body>
</html>
